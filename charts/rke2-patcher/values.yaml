image:
  repository: rancher/rke2-patcher
  tag: v1.3.2
  pullPolicy: IfNotPresent

# Run the ImagePatch controller (declarative patching). The CLI is still available in the
# pod through `kubectl exec`. When disabled the pod only provides the CLI.
controller:
  enabled: true
  # Replicas elect a leader: only one reconciles, the others are standbys that take over
  replicas: 1

# Extra environment variables for the container, e.g. the registry settings
# (RKE2_PATCHER_REGISTRY, RKE2_PATCHER_REGISTRY_USERNAME, ...). Standard EnvVar entries,
# so secrets can be referenced with valueFrom.
env: []
# - name: RKE2_PATCHER_REGISTRY
#   value: registry.example.com

resources: {}

# Scheduling. By default the pod runs on control-plane nodes.
nodeSelector:
  node-role.kubernetes.io/control-plane: "true"
tolerations: []
affinity: {}

# Extra volumes and volume mounts, e.g. to mount a Secret containing a custom registry CA
# certificate (then point RKE2_PATCHER_REGISTRY_CA_FILE at the mounted path through env above).
# Standard Volume/VolumeMount entries.
volumes: []
# - name: registry-ca
#   secret:
#     secretName: rke2-patcher-registry-ca
volumeMounts: []
# - name: registry-ca
#   mountPath: /etc/rke2-patcher/registry-ca
#   readOnly: true
