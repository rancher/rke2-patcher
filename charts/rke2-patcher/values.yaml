image:
  repository: rancher/rke2-patcher
  tag: 1.2.2
  pullPolicy: IfNotPresent

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}

scan:
  # Deploys a CronJob that runs "rke2-patcher fleet-scan" on a schedule, so a fleet-wide
  # CVE/patch-window report is kept up to date without a human exec-ing into the pod.
  enabled: true
  schedule: "0 */4 * * *"
  configMapName: rke2-patcher-report
